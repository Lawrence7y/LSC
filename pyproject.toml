[project]
name = "lsc"
version = "0.1.0"
description = "Live Stream Clipper - 多直播间切片系统"
requires-python = ">=3.10"
# 开发仍推荐 `pip install -r requirements.txt`
dependencies = [
    "PySide6>=6.5,<7",
    "numpy>=1.24,<3",
    "websockets>=12.0",
    "psutil>=5.9,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-psutil>=5.9",
]

[tool.ruff]
target-version = "py310"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "T20", # flake8-type-checking-type
]
ignore = [
    "E501", # line too long — we use 100 chars
    "E402", # module-level import not at top — sys.path manipulation before imports
    "B008", # do not perform function calls in `__init__`
    "SIM105", # use contextlib.suppress — try/except/pass is fine in cleanup code
    "SIM108", # use ternary operator — sometimes if/else is more readable
    "UP006", # use `dict[str, ...]` instead of `Dict[str, ...]`
    "T201", # print() — some prints are intentional (Electron port detection, traceback debug)
    "B023", # function definition in loop — function is called synchronously within same iteration
]
exclude = [
    ".git",
    ".mimocode",
    ".runtime",
    "docs",
    "build",
    "dist",
    "__pycache__",
    "*.egg-info",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311"]  # allow assert and magic numbers in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
follow_imports = "silent"
files = ["lsc"]
exclude = [
    "tests/",
    "docs/",
    ".runtime/",
    ".mimocode/",
    "lsc-electron/",
    "scripts/",
    "lsc/gui/",  # PySide6 dead code, excluded from type checking
]
# python-backend 含连字符，非合法 Python 包名，mypy 无法直接检查
# 通过 MYPYPATH 环境变量或 namespace_packages 配置可后续接入
namespace_packages = true

[[tool.mypy.overrides]]
module = "PySide6.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "psutil"
ignore_missing_imports = true
