disable_error_code = ["no-untyped-def"]

[[tool.mypy.overrides]]
module = "handlers.jianying_handlers"
disable_error_code = ["no-untyped-def"]

[[tool.mypy.overrides]]
module = "handlers.recording_handlers"
disable_error_code = ["no-untyped-def"]

[[tool.mypy.overrides]]
module = "handlers.room_handler"
disable_error_code = ["no-untyped-def"]

[[tool.mypy.overrides]]
module = "handlers.timeline_handlers"
disable_error_code = ["no-untyped-def"]

[[tool.mypy.overrides]]
