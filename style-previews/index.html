<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>LSC 风格预览导航</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #0a0a0f;
    color: #e8e8f0;
    font-family: 'SF Pro Display', 'PingFang SC', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
  }
  h1 {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #60a5fa, #a78bfa, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { color: #8b8ba0; margin-bottom: 48px; font-size: 14px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 24px;
    max-width: 1100px;
    width: 100%;
  }
  .card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 32px 24px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    color: inherit;
    display: block;
  }
  .card:hover {
    transform: translateY(-6px);
    border-color: rgba(167,139,250,0.4);
    box-shadow: 0 20px 60px -15px rgba(167,139,250,0.2);
  }
  .card .icon {
    width: 56px; height: 56px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; margin-bottom: 20px;
  }
  .card h2 { font-size: 18px; margin-bottom: 8px; }
  .card p { font-size: 13px; color: #8b8ba0; line-height: 1.6; }
  .card.card-1 .icon { background: linear-gradient(135deg, rgba(96,165,250,0.2), rgba(167,139,250,0.2)); }
  .card.card-2 .icon { background: rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.1); }
  .card.card-3 .icon { background: rgba(34,197,94,0.15); }
  .card.card-4 .icon { background: linear-gradient(135deg, rgba(251,146,60,0.2), rgba(251,113,133,0.2)); }

  .badge {
    display: inline-block;
    margin-top: 16px;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 11px;
    background: rgba(167,139,250,0.15);
    color: #a78bfa;
    border: 1px solid rgba(167,139,250,0.25);
  }
</style>
</head>
<body>
  <h1>LSC 风格预览</h1>
  <p class="subtitle">点击下方卡片预览不同风格 · 当前代码不会被修改</p>
  <div class="grid">
    <a href="aura.html" class="card card-1">
      <div class="icon">💎</div>
      <h2>Aura · 玻璃拟态</h2>
      <p>半透明毛玻璃面板 + 霓虹渐变光晕，现代感强，层次分明。</p>
      <span class="badge">推荐</span>
    </a>
    <a href="studio.html" class="card card-2">
      <div class="icon">🤍</div>
      <h2>Studio · 极简纯白</h2>
      <p>纯净白底 + 细微边框，类似 Linear / Notion 的专业工具风。</p>
    </a>
    <a href="terminal.html" class="card card-3">
      <div class="icon">⌨️</div>
      <h2>Terminal · 赛博终端</h2>
      <p>暗色 + 等宽字体 + 扫描线效果，极客风格，专注监控。</p>
    </a>
    <a href="warm.html" class="card card-4">
      <div class="icon">🌅</div>
      <h2>Warm · 温暖现代</h2>
      <p>暖色调 + 大圆角 + 柔和阴影，亲和力强，长时间观看舒适。</p>
    </a>
  </div>
</body>
</html>
